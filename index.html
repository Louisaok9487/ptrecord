<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Log</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#11131a; --card:#1b1f2a; --line:#2b3242;
    --text:#eef1f7; --dim:#8b95a9; --accent:#4ade80; --warn:#f87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
       font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:16px 14px 40px;max-width:520px;margin:0 auto}
  h1{font-size:19px;margin:0;letter-spacing:.3px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .plan{font-size:14px;font-weight:600;color:var(--text);text-decoration:none;
       background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .plan:active{opacity:.75}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;padding:11px;font-size:15px;font-weight:600;border-radius:10px;
       background:var(--card);color:var(--dim);border:1px solid var(--line)}
  .tabs button.on{background:var(--accent);color:#08210f;border-color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--dim);margin:0 0 5px;text-transform:uppercase;letter-spacing:.6px}
  select,input{width:100%;padding:13px;font-size:17px;background:#141824;color:var(--text);
       border:1px solid var(--line);border-radius:10px;appearance:none}
  select:focus,input:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  .field{margin-bottom:12px}
  #save{width:100%;padding:15px;font-size:17px;font-weight:600;border:0;border-radius:10px;
       background:var(--accent);color:#08210f}
  #save:active{opacity:.75}
  .last{font-size:14px;color:var(--dim);margin:2px 0 12px;min-height:20px}
  .last b{color:var(--text)}
  .up{color:var(--accent)} .down{color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
  td.d{color:var(--dim);width:78px;font-size:14px;text-align:right;white-space:nowrap}
  td.w{text-align:right;font-weight:600;white-space:nowrap}
  td.r{color:var(--dim);font-size:14px;text-align:right;white-space:nowrap}
  td.x{width:24px;text-align:right}
  td.del{width:34px;text-align:right}
  .del button{background:none;border:0;color:var(--dim);font-size:19px;padding:2px 4px;line-height:1}
  .del button:active{color:var(--warn)}
  .empty{color:var(--dim);font-size:14px;padding:6px 0}
  #msg{font-size:14px;min-height:20px;margin-top:8px;text-align:center}
  h2{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px}
  .grp{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.7px;
       padding:14px 4px 6px;font-weight:700}
  .grp:first-child{padding-top:2px}
  .note{font-size:12px;color:var(--dim);margin-top:10px}
  .hide{display:none}
</style>
</head>
<body>

<div class="top">
  <h1>Workout Log</h1>
  <a class="plan" href="https://github.com/Louisaok9487/ptrecord/blob/main/Louis's%20workout%20plan.pdf" target="_blank" rel="noopener">📄 Plan</a>
</div>

<div class="tabs">
  <button id="tabLog" class="on">Log</button>
  <button id="tabRec">Records</button>
</div>

<!-- ===== LOG TAB ===== -->
<div id="viewLog">
  <div class="card">
    <div class="field">
      <label for="ex">Exercise</label>
      <select id="ex"></select>
    </div>
    <div class="last" id="last"></div>
    <div class="row field">
      <div id="kgBox">
        <label for="kg">Weight (kg)</label>
        <input id="kg" type="number" inputmode="decimal" step="0.5" placeholder="16">
      </div>
      <div>
        <label for="reps" id="repsLabel">Reps (optional)</label>
        <input id="reps" type="number" inputmode="numeric" placeholder="12">
      </div>
    </div>
    <div class="field">
      <label for="date">Date</label>
      <input id="date" type="date">
    </div>
    <button id="save">Save</button>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>History</h2>
    <div id="hist"><div class="empty">Pick an exercise.</div></div>
  </div>
</div>

<!-- ===== RECORDS TAB ===== -->
<div id="viewRec" class="hide">
  <div class="card">
    <h2>Personal Bests</h2>
    <div id="rec"><div class="empty">Loading…</div></div>
    <div class="note"><span class="up">▲</span> = beat your previous best in the last 7 days</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://tnujsnfzymuuvgpewlfs.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRudWpzbmZ6eW11dXZncGV3bGZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2NTE5OTQsImV4cCI6MjA4ODIyNzk5NH0.hsLfEeV7kzhguWyWFh9eBt7AcPhw8cQlCOiUzzgysjc";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PLAN = {
  "Chest": ["DB Incline Press","Incline DB Fly","Front Machine Press","Cross Cable","Cable Fly","Flat Bench DB Press","Bar Dips (bodyweight)"],
  "Back":  ["T-Bar Rows","Seated Rowing","One Hand DB Rowing","Incline Dumbbell Pullover"],
  "Traps": ["Shrugs on Smith Machine from Back","Seated DB Shrugs"],
  "Delts": ["Shoulder DB Press","Lateral Raises","Seated Front Raises","Pec Dec Reverse Fly","Wide Grip Upright Row"],
  "Biceps":["Hammer Curls","E-Z Bar Curls"],
  "Triceps":["Straight Bar Pushdown","Overhead DB Extension"],
  "Legs":  ["Leg Extension","Smith Machine Squats / Hack Squats","Leg Press","Lunges","Leg Curl"],
  "Calves":["Standing Smith Machine Calf Raises","Seated Calf Raises"],
  "Abs":   ["Hanging Leg Raises","Reverse Cable Crunch","Decline Weighted Sit Ups","Cable Crunch with Rope","Side Plank with DB Standing Twist","Decline Bench Leg Raises","Ab-Wheel Roll Out"]
};

// Bodyweight-style exercises: track reps, not weight
const REP_ONLY = new Set([
  "Bar Dips (bodyweight)",
  "Hanging Leg Raises",
  "Decline Weighted Sit Ups",
  "Side Plank with DB Standing Twist",
  "Decline Bench Leg Raises",
  "Ab-Wheel Roll Out"
]);

const $ = id => document.getElementById(id);
const exSel = $("ex");
const isRep = name => REP_ONLY.has(name);
const num = v => (v === null || v === undefined || v === "") ? null : Number(v);

for (const [group, list] of Object.entries(PLAN)) {
  const og = document.createElement("optgroup");
  og.label = group;
  list.forEach(name => {
    const o = document.createElement("option");
    o.value = name; o.textContent = name; o.dataset.group = group;
    og.appendChild(o);
  });
  exSel.appendChild(og);
}

const today = () => new Date().toLocaleDateString("en-CA");
$("date").value = today();
exSel.value = localStorage.getItem("lastEx") || exSel.options[0].value;

const fmtDate = s => { const [y,m,d] = s.split("-"); return `${d}/${m}/${y.slice(2)}`; };

// Score used for "best" and progress: weight for normal, reps for rep-only.
// Tie on weight -> higher reps wins.
const score = (r, rep) => rep ? num(r.reps) : num(r.weight_kg);
const better = (a, b, rep) => {
  const sa = score(a, rep), sb2 = score(b, rep);
  if (sa === null) return false;
  if (sb2 === null) return true;
  if (sa !== sb2) return sa > sb2;
  if (!rep) return (num(a.reps) || 0) > (num(b.reps) || 0);
  return false;
};
const fmtBest = (r, rep) => rep
  ? `${r.reps} reps`
  : `${Number(r.weight_kg)} kg${r.reps ? ` × ${r.reps}` : ""}`;

/* ---------- tabs ---------- */
function show(tab) {
  const isLog = tab === "log";
  $("viewLog").classList.toggle("hide", !isLog);
  $("viewRec").classList.toggle("hide", isLog);
  $("tabLog").classList.toggle("on", isLog);
  $("tabRec").classList.toggle("on", !isLog);
  if (!isLog) loadRecords();
}
$("tabLog").onclick = () => show("log");
$("tabRec").onclick = () => show("rec");

/* ---------- form mode ---------- */
function setMode() {
  const rep = isRep(exSel.value);
  $("kgBox").classList.toggle("hide", rep);
  $("repsLabel").textContent = rep ? "Reps" : "Reps (optional)";
  $("kg").value = "";
}

/* ---------- log tab ---------- */
async function load() {
  const name = exSel.value;
  const rep = isRep(name);
  localStorage.setItem("lastEx", name);
  setMode();
  $("hist").innerHTML = '<div class="empty">Loading…</div>';

  const { data, error } = await sb.from("workout_log")
    .select("id,logged_on,weight_kg,reps")
    .eq("exercise", name)
    .order("logged_on", { ascending:false })
    .order("id", { ascending:false });

  if (error) { $("hist").innerHTML = `<div class="empty">${error.message}</div>`; return; }

  if (!data.length) {
    $("last").innerHTML = "No record yet — first one sets the baseline.";
    $("hist").innerHTML = '<div class="empty">Nothing logged for this exercise.</div>';
    return;
  }

  const valid = data.filter(r => score(r, rep) !== null);
  const best = valid.reduce((b, r) => (!b || better(r, b, rep)) ? r : b, null);
  const l = data[0];
  const lastTxt = score(l, rep) !== null ? fmtBest(l, rep) : "–";
  $("last").innerHTML = `Last: <b>${lastTxt}</b> on <b>${fmtDate(l.logged_on)}</b>`
    + (best ? ` &nbsp;·&nbsp; Best: <b>${fmtBest(best, rep)}</b>` : "");

  $("hist").innerHTML = "<table>" + data.map((r,i) => {
    const prev = data[i+1];
    let arrow = "";
    const a = score(r, rep), b = prev ? score(prev, rep) : null;
    if (a !== null && b !== null) {
      if (a > b) arrow = '<span class="up">▲</span>';
      else if (a < b) arrow = '<span class="down">▼</span>';
    }
    const main = rep
      ? (r.reps ? `${r.reps} reps` : "–")
      : (r.weight_kg != null ? `${Number(r.weight_kg)} kg` : "–");
    const side = (!rep && r.reps) ? `${r.reps} reps` : "";
    return `<tr><td class="d" style="text-align:left">${fmtDate(r.logged_on)}</td>
      <td class="r" style="text-align:left">${side}</td>
      <td class="w">${main}</td>
      <td class="x">${arrow}</td>
      <td class="del"><button data-id="${r.id}" title="Delete">×</button></td></tr>`;
  }).join("") + "</table>";

  $("hist").querySelectorAll("button[data-id]").forEach(btn => {
    btn.onclick = () => removeRow(Number(btn.dataset.id));
  });
}

async function removeRow(id) {
  if (!confirm("Delete this record?")) return;
  const { error } = await sb.from("workout_log").delete().eq("id", id);
  if (error) { alert(error.message); return; }
  load();
}

/* ---------- records tab ---------- */
async function loadRecords() {
  $("rec").innerHTML = '<div class="empty">Loading…</div>';
  const { data, error } = await sb.from("workout_log")
    .select("exercise,logged_on,weight_kg,reps");

  if (error) { $("rec").innerHTML = `<div class="empty">${error.message}</div>`; return; }

  const d = new Date(); d.setDate(d.getDate() - 7);
  const cutoff = d.toLocaleDateString("en-CA");

  // per exercise: overall best, best in last 7 days, best before that
  const stats = {};
  data.forEach(r => {
    const rep = isRep(r.exercise);
    if (score(r, rep) === null) return;
    const s = stats[r.exercise] || (stats[r.exercise] = { best:null, recent:null, older:null });
    if (!s.best || better(r, s.best, rep) ||
        (score(r, rep) === score(s.best, rep) && r.logged_on > s.best.logged_on && !better(s.best, r, rep))) s.best = r;
    const key = r.logged_on > cutoff ? "recent" : "older";
    if (!s[key] || better(r, s[key], rep)) s[key] = r;
  });

  let html = "", any = false;
  for (const [group, list] of Object.entries(PLAN)) {
    const rows = list.filter(n => stats[n]);
    if (!rows.length) continue;
    any = true;
    html += `<div class="grp">${group}</div><table>`;
    rows.forEach(n => {
      const rep = isRep(n);
      const s = stats[n];
      const up = s.recent && s.older && score(s.recent, rep) > score(s.older, rep);
      html += `<tr>
        <td>${n}</td>
        <td class="w">${fmtBest(s.best, rep)}</td>
        <td class="d">${fmtDate(s.best.logged_on)}</td>
        <td class="x">${up ? '<span class="up">▲</span>' : ""}</td>
      </tr>`;
    });
    html += "</table>";
  }

  $("rec").innerHTML = any ? html : '<div class="empty">Nothing logged yet.</div>';
}

/* ---------- save ---------- */
$("save").onclick = async () => {
  const opt = exSel.selectedOptions[0];
  const rep = isRep(opt.value);
  const kg = $("kg").value.trim();
  const reps = $("reps").value.trim();

  if (rep && reps === "") { $("msg").innerHTML = '<span class="down">Enter reps.</span>'; return; }
  if (!rep && kg === "")  { $("msg").innerHTML = '<span class="down">Enter a weight.</span>'; return; }

  $("save").disabled = true; $("msg").textContent = "Saving…";

  const { error } = await sb.from("workout_log").insert({
    logged_on: $("date").value || today(),
    muscle_group: opt.dataset.group,
    exercise: opt.value,
    weight_kg: rep ? null : Number(kg),
    reps: reps === "" ? null : Number(reps)
  });

  $("save").disabled = false;
  if (error) { $("msg").innerHTML = `<span class="down">${error.message}</span>`; return; }
  $("msg").innerHTML = '<span class="up">Saved ✓</span>';
  $("kg").value = ""; $("reps").value = "";
  setTimeout(() => $("msg").textContent = "", 2000);
  load();
};

exSel.onchange = load;
load();
</script>
</body>
</html>
